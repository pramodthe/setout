# Model profiles for 3D Make. No API keys in this file.
# Each profile reads its base URL and key from the named environment variables.
default: muse
profiles:
  muse:
    label: "Muse Spark 1.3"
    base_url_env: LLM_BASE_URL
    api_key_env: LLM_API_KEY
    model: muse-spark-1.3
    vision: true
    tools: auto
  alt:
    label: "Alt model"
    base_url_env: ALT_LLM_BASE_URL
    api_key_env: ALT_LLM_API_KEY
    model_env: ALT_LLM_MODEL
    vision: true
    tools: auto
