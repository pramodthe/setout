# Relation kinds a program may declare between two parts (NativeRelation.kind),
# each defined in our own words. `check` says what the verifier does with the
# kind today: `geometric` kinds are measured on the built meshes against a pass
# mark the verifier owns; `unverified` kinds cannot be measured, and stay open
# as a required UNVERIFIED, so they cannot stand in for a measurement. The
# contact kinds share one measure. laps_over may have less contact between two
# layers, fixed_to is measured on the solids along the fixing, and hosted_in on
# the target's solid either side of the part.
status: draft
relations:
  - id: supported_by
    definition: The source part bears on the target part, which carries its weight.
    check: geometric
  - id: bonded_to
    definition: The source part is adhered or fused to the target over their shared face.
    check: geometric
  - id: covers
    definition: The source part lies over the target and hides its face.
    check: geometric
  - id: laps_over
    definition: The source part overlaps the edge of the target so water runs off it, not under it.
    check: geometric
  - id: terminates_against
    definition: The source part stops at the target's face and goes no further.
    check: geometric
  - id: sealed_to
    definition: A sealant or gasket closes the joint between the source and the target.
    check: geometric
  - id: installed_before
    definition: The source part is installed before the target part (sequence only).
    check: geometric
  - id: hosted_in
    definition: The source part sits inside an opening the target forms and is held by it, as a leaf sits in its frame.
    check: geometric
  - id: fixed_to
    definition: The source part is mechanically fastened to the target.
    check: geometric
  - id: abuts
    definition: The source part meets the target edge to edge with no overlap.
    check: geometric
  - id: repeated_along
    definition: The source part recurs at a spacing along the target's run.
    check: unverified
