<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setout</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b23; --line:#263040; --ink:#e7edf5;
    --muted:#8fa0b5; --accent:#4ea1ff; --ok:#3ecf8e; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #app{display:grid;grid-template-columns:272px 1fr;height:100%}
  @media (max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:46vh 1fr}
    main{order:-1;min-height:0}
    #details{flex-direction:column}
    #app #details button{flex:none}}
  aside{background:var(--panel);border-right:1px solid var(--line);
    padding:16px;overflow:auto}
  h1{font-size:15px;margin:0 0 2px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:18px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.9px;
    color:var(--muted);margin:18px 0 8px;font-weight:600}
  .layer{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;
    cursor:pointer;user-select:none}
  .layer:hover{background:#1d2430}
  .layer input{accent-color:var(--accent);margin:0}
  .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .chk{padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    margin-bottom:7px;background:#121823}
  .chk .p{font-size:12px;color:var(--muted)}
  .chk .v{font-size:15px;font-weight:600;margin-top:1px}
  .chk .c{font-size:11px;color:var(--muted);margin-top:4px;word-break:break-all}
  .pass{border-left:3px solid var(--ok)} .fail{border-left:3px solid var(--bad)}
  main{position:relative;min-height:0}
  canvas{display:block}
  #hud{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;
    background:linear-gradient(transparent,rgba(10,13,18,.93) 38%);
    pointer-events:none}
  #hud .t{font-size:15px;font-weight:600}
  #hud .n{color:var(--muted);font-size:13px;margin-top:2px}
  #hud .r{margin-top:7px;font-size:12.5px;color:#cfe0f5;
    border-left:2px solid var(--accent);padding-left:9px;max-width:720px}
  #hud .cl{color:var(--accent);font-weight:600}
  #hint{position:absolute;top:14px;right:18px;color:var(--muted);font-size:12px}
  #details{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  #details button{background:#121823;color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer;
    flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #details button.on{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1 id="title">Setout</h1>
    <div class="sub" id="units"></div>
    <div id="details"></div>
    <h2>Build-up</h2>
    <div id="layers"></div>
    <h2>Rule checks</h2>
    <div id="checks"></div>
  </aside>
  <main>
    <div id="hint">drag to orbit &middot; scroll to zoom &middot; click a part</div>
    <div id="hud"><div class="t">Click any part of the detail</div>
      <div class="n">Each surface was placed by a rule, not by hand.</div></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="scenes.js"></script>
<script src="scene.js"></script>
<script>
const ALL = window.SCENES || {shower_hob: window.SCENE};
const KEYS = Object.keys(ALL);
const S = ALL[(location.hash || '').slice(1)] || ALL[KEYS[0]];
const detEl = document.getElementById('details');
KEYS.forEach(k=>{
  const b=document.createElement('button');
  b.textContent=ALL[k].title; if(ALL[k]===S) b.className='on';
  b.onclick=()=>{ location.hash=k; location.reload(); };
  detEl.appendChild(b);
});
const K = 0.01; // mm -> scene units

document.getElementById('title').textContent = S.title;
document.getElementById('units').textContent =
  'Geometry generated from ' + Object.keys(S.rules_used).length +
  ' rules · all dimensions in ' + S.units;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
scene.add(new THREE.HemisphereLight(0xffffff, 0x27303d, 0.85));
const key = new THREE.DirectionalLight(0xffffff, .6);
key.position.set(6, 10, 8); scene.add(key);

const main = document.querySelector('main');
const camera = new THREE.PerspectiveCamera(42, 1, .1, 800);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
main.appendChild(renderer.domElement);

const root = new THREE.Group(); scene.add(root);
const picks = [];

function mat(hex, op){
  return new THREE.MeshStandardMaterial({
    color:new THREE.Color(hex), roughness:.82, metalness:.03,
    transparent: op < 1, opacity: op });
}
function tag(mesh, src, label, ruleId){
  mesh.userData = {name: src.name, layer: src.layer, note: label || src.note,
                   rule_id: ruleId || src.rule_id};
  picks.push(mesh); root.add(mesh);
}
function addBox(s){
  const g = new THREE.BoxGeometry(s.w*K, s.h*K, s.d*K);
  const m = new THREE.Mesh(g, mat(s.color, .95));
  m.position.set((s.x+s.w/2)*K, (s.y+s.h/2)*K, (s.z+s.d/2)*K);
  tag(m, s);
}
function addPolyline(s){
  const t = s.thickness*K, d = s.d*K;
  for (let i=0;i<s.path.length-1;i++){
    const a=s.path[i], b=s.path[i+1];
    const dx=(b.x-a.x)*K, dy=(b.y-a.y)*K;
    const len=Math.hypot(dx,dy);
    if (len < 1e-9) continue;
    const g=new THREE.BoxGeometry(len+t, t, d);
    const m=new THREE.Mesh(g, mat(s.color, 1));
    m.position.set((a.x*K+dx/2), (a.y*K+dy/2), d/2);
    m.rotation.z=Math.atan2(dy,dx);
    tag(m, s, b.label || a.label, b.rule_id || s.rule_id);
  }
}

S.solids.forEach(s=>{
  if (s.kind==='box') addBox(s);
  else if (s.kind==='polyline') addPolyline(s);
});

// frame the model
const box = new THREE.Box3().setFromObject(root);
const size = box.getSize(new THREE.Vector3());
// pivot on the ruled layer so the detail, not the blank wall, fills the frame
const memb = new THREE.Box3();
picks.forEach(m=>{ if(m.userData.layer==='membrane') memb.expandByObject(m); });
const ctr = memb.isEmpty() ? box.getCenter(new THREE.Vector3())
                            : memb.getCenter(new THREE.Vector3());
root.position.sub(ctr);
const radius = Math.max(size.x, size.y, size.z);

// --- minimal orbit (no extra dependency) ---
let yaw=-0.72, pitch=0.3, dist=radius*1.65, drag=false, px=0, py=0;
function place(){
  camera.position.set(dist*Math.cos(pitch)*Math.sin(yaw),
                      dist*Math.sin(pitch),
                      dist*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(0,0,0);
}
const el = renderer.domElement;
el.addEventListener('pointerdown', e=>{drag=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup', ()=>drag=false);
addEventListener('pointermove', e=>{
  if(!drag) return;
  yaw -= (e.clientX-px)*.007;
  pitch = Math.max(-1.3, Math.min(1.3, pitch + (e.clientY-py)*.007));
  px=e.clientX; py=e.clientY; place();
});
el.addEventListener('wheel', e=>{
  e.preventDefault();
  dist = Math.max(radius*.35, Math.min(radius*4, dist*(1+Math.sign(e.deltaY)*.12)));
  place();
}, {passive:false});

function resize(){
  const w=main.clientWidth, h=main.clientHeight;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize(); place();
(function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); })();

// --- layer toggles ---
const COL = {};
S.solids.forEach(s=>{ if(!COL[s.layer]) COL[s.layer]=s.color; });
const layersEl = document.getElementById('layers');
S.layer_order.forEach(name=>{
  const row=document.createElement('label'); row.className='layer';
  row.innerHTML = '<input type="checkbox" checked>' +
    '<span class="sw" style="background:'+(COL[name]||'#666')+'"></span>' +
    '<span>'+name.replace(/_/g,' ')+'</span>';
  row.querySelector('input').onchange = e=>{
    picks.forEach(m=>{ if(m.userData.layer===name) m.visible=e.target.checked; });
  };
  layersEl.appendChild(row);
});

// --- rule checks ---
const checksEl = document.getElementById('checks');
S.checks.forEach(c=>{
  const d=document.createElement('div');
  d.className='chk '+(c.satisfied?'pass':'fail');
  const rule = S.rules_used[c.rule_id];
  d.innerHTML = '<div class="p">'+c.parameter.replace(/_/g,' ')+'</div>'+
    '<div class="v">'+c.value+' mm '+(c.satisfied?'✓':'✗')+'</div>'+
    '<div class="c">'+(rule? rule.id : c.rule_id||'')+'</div>';
  checksEl.appendChild(d);
});

// --- picking ---
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const hud=document.getElementById('hud');
el.addEventListener('click', e=>{
  const r=el.getBoundingClientRect();
  ndc.x=((e.clientX-r.left)/r.width)*2-1;
  ndc.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(picks.filter(m=>m.visible))[0];
  if(!hit) return;
  const u=hit.object.userData;
  const rule=u.rule_id ? S.rules_used[u.rule_id] : null;
  hud.innerHTML='<div class="t">'+u.name+'</div>'+
    '<div class="n">'+(u.note||'')+'</div>'+
    (rule? '<div class="r"><span class="cl">'+rule.id+'</span> — '+rule.text+'</div>'
         : '<div class="r">Product dimension — not set by code.</div>');
});
</script>
</body>
</html>
